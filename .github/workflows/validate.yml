name: Validate skill

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check portability
        run: python scripts/check_portability.py
      - name: Validate outline library
        run: python scripts/validate_outline_library.py
      - name: Run regression tests
        run: python scripts/test_content_package.py
